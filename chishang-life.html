<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3d6e8c">
<title>池上村幹事人生</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{--green:#7fa650;--gold:#e9c46a;--blue:#3d6e8c;--paper:#f7f3e8;--red:#c8402a;--ink:#2b2622;--mute:#7a7266;--line:rgba(43,38,34,.14);--card:#fffdf7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#1c2b3a;color:var(--ink);font-family:"Huninn","Noto Sans TC",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
/* 頂部列 */
#top{position:fixed;left:0;right:0;top:0;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.chip{background:rgba(255,253,247,.94);border-radius:14px;padding:5px 10px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
#clock b{font-size:17px;font-variant-numeric:tabular-nums}
#date{font-size:12px;color:var(--mute)}
#speed{display:flex;gap:2px;padding:3px}
#speed button{width:32px;height:28px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mute)}
#speed button.on{background:var(--blue);color:#fff}
#moneyC b{color:#2f6b2f}
#moodC{cursor:pointer}
#loc{position:fixed;left:8px;top:calc(50px + env(safe-area-inset-top));z-index:4;pointer-events:auto}
#loc .chip{flex-direction:column;align-items:flex-start;gap:0;padding:6px 12px}
#loc b{font-size:16px}#loc small{color:var(--mute);font-size:11px}
#rightBtns{position:fixed;right:8px;top:calc(50px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;z-index:4}
.rb{width:52px;height:52px;border-radius:16px;background:rgba(255,253,247,.95);box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;line-height:1}
.rb small{font-size:10px;margin-top:3px;color:var(--mute)}
.rb.on{background:var(--gold)}
#feed{position:fixed;left:8px;top:calc(104px + env(safe-area-inset-top));width:min(360px,calc(100vw - 84px));z-index:3;pointer-events:none;display:flex;flex-direction:column;gap:4px}
.fd{background:rgba(255,253,247,.92);border-left:4px solid var(--blue);border-radius:8px;padding:5px 8px;font-size:12.5px;line-height:1.35;box-shadow:0 1px 4px rgba(0,0,0,.12);animation:fin .25s ease-out;transition:opacity .6s}
.fd.good{border-color:var(--green)}.fd.bad{border-color:var(--red)}.fd.big{border-color:var(--gold);font-weight:700}
@keyframes fin{from{transform:translateX(-12px);opacity:0}}
/* 底部 */
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(180deg,rgba(247,243,232,.0),rgba(247,243,232,.0))}
#queue{display:flex;gap:6px;padding:0 8px 6px;align-items:flex-end;overflow-x:auto;scrollbar-width:none}
.qi{flex:none;background:rgba(255,253,247,.96);border-radius:12px;padding:5px 8px;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.15);position:relative;max-width:150px;display:flex;align-items:center;gap:6px}
.qi.cur{border:2px solid var(--blue);max-width:220px}
.qi .bar{position:absolute;left:6px;right:6px;bottom:2px;height:3px;border-radius:2px;background:#e4ddcc;overflow:hidden}
.qi .bar i{display:block;height:100%;background:var(--blue)}
.qi .x{width:20px;height:20px;border-radius:50%;background:#eee3d0;font-size:12px;flex:none}
.qi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tabs{display:flex;background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -3px 10px rgba(0,0,0,.12)}
#tabs button{flex:1;padding:7px 0 6px;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
#tabs button i{font-style:normal;font-size:18px;line-height:1}
#tabs button.on{color:var(--blue);font-weight:700;background:#efe8d6}
#tabs .dot{position:absolute;top:4px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
#sheet{background:var(--paper);max-height:min(52vh,460px);overflow-y:auto;border-top:1px solid var(--line);padding:10px 12px 12px;font-size:14px;-webkit-overflow-scrolling:touch}
#sheet h3{margin:4px 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
#sheet h3 small{font-weight:400;color:var(--mute);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr 1fr}}
.need{font-size:12.5px}
.need .lb{display:flex;justify-content:space-between}
.meter{height:9px;border-radius:5px;background:#e4ddcc;overflow:hidden;margin-top:3px}
.meter i{display:block;height:100%;border-radius:5px;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:7px}
.card.tap{cursor:pointer}.card.tap:active{background:#f1ead8}
.trow{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.trow b{font-size:14px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;background:#e8eef2;color:var(--blue);margin-right:4px;white-space:nowrap}
.tag.r{background:#f7dcd5;color:var(--red)}.tag.g{background:#e3eed6;color:#4a7a2a}.tag.y{background:#f8edc8;color:#8a6a10}
.desc{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.45}
.btn{background:var(--blue);color:#fff;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700}
.btn.s{padding:5px 9px;font-size:12px}.btn.alt{background:#e4ddcc;color:var(--ink)}.btn.red{background:var(--red)}.btn.gold{background:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.4}
.acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv span{color:var(--mute)}
.log{font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line);line-height:1.4}
.log small{color:var(--mute);margin-right:6px}
.log.bad{color:#9a2a1a}.log.good{color:#3a6a1a}.log.big{font-weight:700}
.grades{display:flex;flex-wrap:wrap;gap:3px}
.grades i{font-style:normal;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#e3eed6;color:#4a7a2a}
.grades i.b{background:#e8eef2;color:var(--blue)}.grades i.c{background:#f7dcd5;color:var(--red)}
/* 選單 */
#menu{position:fixed;z-index:20;background:var(--card);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.3);padding:8px;min-width:200px;max-width:min(320px,92vw);max-height:60vh;overflow-y:auto}
#menu .mt{font-weight:700;padding:4px 6px 6px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
#menu .mt small{font-weight:400;color:var(--mute)}
#menu button.mi{display:block;width:100%;text-align:left;padding:9px 8px;border-radius:9px;font-size:14px}
#menu button.mi:active,#menu button.mi:hover{background:#f1ead8}
#menu button.mi small{display:block;color:var(--mute);font-size:11.5px}
#menu button.mi.task{border-left:4px solid var(--red);background:#fff6f2}
/* 覆蓋視窗 */
.ov{position:fixed;inset:0;z-index:30;background:rgba(20,28,40,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--paper);border-radius:18px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.4);padding:18px}
.box h2{margin:0 0 10px;font-size:20px;display:flex;align-items:center;gap:8px}
.box p{white-space:pre-line;line-height:1.65;margin:0 0 14px;font-size:15px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts .btn{padding:11px 14px;font-size:15px;text-align:left}
.stamp{display:inline-block;border:2px solid var(--red);color:var(--red);border-radius:6px;padding:0 6px;font-size:13px;transform:rotate(-6deg)}
/* 地圖 */
#mapBox{max-width:640px;padding:12px}
#mapCv{width:100%;aspect-ratio:4/3;border-radius:12px;display:block;touch-action:none}
.locList{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.locList button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px;text-align:left;font-size:13px}
.locList button small{display:block;color:var(--mute);font-size:11px}
.locList button.here{border-color:var(--red);background:#fff2ee}
/* 標題 */
#title{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(180deg,#8fc6ec 0%,#dff2fb 45%,#9cc25a 46%,#e2b84a 100%)}
#title .box{text-align:center;background:rgba(247,243,232,.96)}
#title h1{margin:4px 0 2px;font-size:30px;letter-spacing:2px;color:var(--blue)}
#title .sub{color:var(--mute);font-size:13px;margin-bottom:14px;line-height:1.6}
#title .opts .btn{text-align:center}
.form{display:grid;gap:9px;text-align:left;font-size:14px}
.form label{display:flex;justify-content:space-between;align-items:center;gap:10px}
.form input[type=text]{flex:1;font:inherit;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;max-width:200px}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.seg button{min-width:32px;height:30px;border-radius:9px;background:#e4ddcc;font-size:13px;padding:0 8px}
.seg button.on{background:var(--blue);color:#fff}
.sw{width:26px!important;min-width:26px!important;border:2px solid transparent}.sw.on{border-color:var(--ink)!important}
#pv{width:120px;height:150px;display:block;margin:0 auto;background:radial-gradient(circle at 50% 70%,#fff8e6,#efe4d2);border-radius:14px}
.end h2{justify-content:center}
.end .epi{font-size:15px;text-align:center;color:var(--mute);margin:0 0 12px}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:50;background:rgba(43,38,34,.88);color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;pointer-events:none;transition:opacity .3s;text-align:center;max-width:80vw}
@media(max-width:560px){#top{gap:4px}.chip{padding:4px 8px;font-size:12px}#clock{flex-direction:column;align-items:flex-start;gap:0;padding:3px 10px}#clock b{font-size:16px}#date{font-size:10.5px}#speed button{width:28px;height:26px;font-size:11px}.fd{font-size:11.5px}.rb{width:46px;height:46px;font-size:18px}#mood{display:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top" hidden>
  <div class="chip" id="clock"><b id="clk">06:30</b><span id="date"></span></div>
  <div class="chip" id="speed"><button data-s="0">❚❚</button><button data-s="1" class="on">▶</button><button data-s="2">▶▶</button><button data-s="3">▶▶▶</button></div>
  <div class="chip" id="moneyC">💰 <b id="money">0</b></div>
  <div class="chip" id="moodC">🙂 <span id="mood"></span></div>
</div>
<div id="loc" hidden><div class="chip"><b id="locN"></b><small id="locS"></small></div></div>
<div id="rightBtns" hidden>
  <button class="rb" id="bMap">🗺️<small>地圖</small></button>
  <button class="rb" id="bAuto">🤖<small>自動</small></button>
  <button class="rb" id="bSave">💾<small>存檔</small></button>
</div>
<div id="feed"></div>
<div id="bottom" hidden>
  <div id="queue"></div>
  <div id="sheet" hidden></div>
  <div id="tabs">
    <button data-t="need"><i>❤️</i>需求</button>
    <button data-t="task"><i>📋</i>案件<span class="dot" id="taskDot" hidden></span></button>
    <button data-t="ppl"><i>👥</i>人物</button>
    <button data-t="skill"><i>📚</i>技能</button>
    <button data-t="job"><i>🏛️</i>職涯</button>
    <button data-t="life"><i>🏠</i>生活</button>
    <button data-t="log"><i>📜</i>紀錄</button>
  </div>
</div>
<div id="menu" hidden></div>
<div class="ov" id="evOv" hidden><div class="box" id="evBox"></div></div>
<div class="ov" id="mapOv" hidden><div class="box" id="mapBox"><h2>🗺️ 池上鄉 <small style="font-size:13px;color:var(--mute);font-weight:400">點地點騎車前往</small></h2><canvas id="mapCv"></canvas><div class="locList" id="locList"></div><div style="text-align:right;margin-top:8px"><button class="btn alt" id="mapClose">關閉</button></div></div></div>
<div class="ov" id="endOv" hidden><div class="box end" id="endBox"></div></div>
<div id="title"><div class="box" id="titleBox"></div></div>
<div id="toast" style="opacity:0"></div>
<script>
/* 模組 1／5：資料 — 地點、物件與動作、工作案件、隨機事件、人物、職涯、行事曆
   參考：臺灣省村里幹事服務要點（平地鄉鎮上午集中公所辦公、下午赴村辦公處）、池上鄉公所原住民族事務所服務項目。
   人物與事件皆為虛構。 */
(function () {
'use strict';
const D = window.D = {};

/* ---------- 時間 ---------- */
D.MONTH_DAYS = 7;            /* 一個月濃縮成一週：週一到週五上班、週六日休假 */
D.YEAR_DAYS = 12 * 7;
D.START_YEAR = 115;          /* 民國 115 年 */
D.WEEK = ['一', '二', '三', '四', '五', '六', '日'];

/* ---------- 地點 ---------- */
D.LOCS = {
  home: { n: '租屋處', sub: '福原村・鄉內市區', map: [0.30, 0.34], theme: 'home' },
  office: { n: '池上鄉公所', sub: '原住民族事務所', map: [0.38, 0.30], theme: 'office' },
  vo: { n: '大埔村辦公處', sub: '村幹事下午駐點', map: [0.50, 0.52], theme: 'vo' },
  village: { n: '大埔村聚落', sub: '家戶訪問・查報', map: [0.56, 0.62], theme: 'village' },
  tribe: { n: '部落聚會所', sub: 'Kalokapuk 大埔部落', map: [0.46, 0.70], theme: 'tribe' },
  care: { n: '文化健康站', sub: '部落長者照顧', map: [0.62, 0.70], theme: 'care' },
  field: { n: '稻田與伯朗大道', sub: '農損勘查・騎車散心', map: [0.72, 0.30], theme: 'field' },
  town: { n: '中正路街區', sub: '便當店・超商・衛生所', map: [0.34, 0.46], theme: 'town' },
  lake: { n: '大坡池', sub: '散步・發呆', map: [0.62, 0.46], theme: 'lake' },
};
/* 機車移動時間（分鐘）依地圖距離估算 */
D.travel = (a, b) => { if (a === b) return 0; const p = D.LOCS[a].map, q = D.LOCS[b].map; return Math.max(4, Math.round(Math.hypot(p[0] - q[0], p[1] - q[1]) * 38)); };

/* ---------- 需求 ----------
   每小時自然變化（清醒時） */
D.NEEDS = { hunger: { n: '飽足', ic: '🍚', dec: 6 }, energy: { n: '精力', ic: '⚡', dec: 4.2 }, hygiene: { n: '清潔', ic: '🚿', dec: 2.6 }, social: { n: '社交', ic: '💬', dec: 2.2 }, fun: { n: '娛樂', ic: '🎈', dec: 2.8 } };
D.SKILLS = { admin: { n: '行政公文', ic: '📄' }, law: { n: '法規熟悉', ic: '⚖️' }, talk: { n: '溝通協調', ic: '🤝' }, lang: { n: '阿美族語', ic: '🗣️' }, body: { n: '體能', ic: '🏃' }, cook: { n: '料理', ic: '🍳' } };

/* ---------- 物件與動作 ----------
   e：每分鐘對需求的影響；sk：技能經驗；w：時段限制 [起, 迄] 小時；cost：花費 */
const A = (n, dur, e, o) => Object.assign({ n, dur, e: e || {} }, o || {});
D.OBJ = {
  home: [
    { id: 'bed', n: '床', x: 0.16, acts: { sleep: A('睡覺', 480, { energy: 0.21, stress: -0.04 }, { sleep: 1 }), nap: A('小睡 1 小時', 60, { energy: 0.25 }) } },
    { id: 'desk', n: '書桌', x: 0.36, acts: { study: A('讀法規與函釋', 60, { energy: -0.06, fun: -0.02 }, { sk: { law: 1 } }), lang: A('上線上族語課', 60, { energy: -0.05, fun: 0.02 }, { sk: { lang: 1.2 } }), web: A('滑手機上網', 45, { fun: 0.28, energy: -0.02 }) } },
    { id: 'kitchen', n: '電鍋與冰箱', x: 0.56, acts: { cook: A('煮一頓飯', 50, { hunger: 1.1, fun: 0.05 }, { sk: { cook: 1 }, cost: 90 }), snack: A('吃泡麵', 15, { hunger: 2.4 }, { cost: 35 }) } },
    { id: 'tv', n: '電視', x: 0.74, acts: { tv: A('看電視', 60, { fun: 0.4, energy: -0.02, stress: -0.08 }), call: A('和家人視訊', 30, { social: 1.4, stress: -0.05 }) } },
    { id: 'bath', n: '浴室', x: 0.9, acts: { shower: A('洗澡', 20, { hygiene: 4.5, stress: -0.1 }) } },
  ],
  office: [
    { id: 'clock', n: '打卡機', x: 0.08, acts: { clockin: A('打卡上班', 2, {}, { clock: 'in' }), clockout: A('打卡下班', 2, {}, { clock: 'out' }) } },
    { id: 'counter', n: '服務櫃檯', x: 0.28, acts: {}, task: 'counter' },
    { id: 'desk', n: '我的辦公桌', x: 0.5, acts: {}, task: 'desk' },
    { id: 'chief', n: '所長座位', x: 0.7, npc: 'chief', acts: { report: A('向所長回報進度', 15, { stress: -0.05 }, { rel: 2 }) } },
    { id: 'meeting', n: '會議室', x: 0.88, acts: {}, task: 'meeting' },
  ],
  vo: [
    { id: 'board', n: '公布欄', x: 0.18, acts: {}, task: 'board' },
    { id: 'desk', n: '村辦公處辦公桌', x: 0.45, acts: {}, task: 'vo' },
    { id: 'head', n: '村長', x: 0.72, npc: 'head', acts: {} },
  ],
  village: [
    { id: 'house1', n: '住戶甲', x: 0.15, acts: {}, task: 'house' },
    { id: 'house2', n: '住戶乙', x: 0.42, acts: {}, task: 'house' },
    { id: 'lamp', n: '路燈與水溝', x: 0.64, acts: {}, task: 'street' },
    { id: 'house3', n: '住戶丙', x: 0.85, acts: {}, task: 'house' },
  ],
  tribe: [
    { id: 'elder', n: '耆老', x: 0.3, npc: 'elder', acts: {} },
    { id: 'hall', n: '聚會所', x: 0.62, acts: {}, task: 'tribe' },
  ],
  care: [
    { id: 'elders', n: '長輩們', x: 0.35, acts: {}, task: 'care' },
    { id: 'staff', n: '照服員', x: 0.7, npc: 'carer', acts: {} },
  ],
  field: [
    { id: 'paddy', n: '稻田', x: 0.3, acts: { walk: A('沿著田埂散步', 40, { fun: 0.35, energy: -0.05, stress: -0.2 }, { sk: { body: 0.5 } }) }, task: 'field' },
    { id: 'bike', n: '腳踏車出租', x: 0.72, acts: { ride: A('騎單車逛伯朗大道', 60, { fun: 0.6, energy: -0.12, stress: -0.3, hygiene: -0.05 }, { sk: { body: 1 }, cost: 100 }) } },
  ],
  town: [
    { id: 'bento', n: '便當店', x: 0.2, acts: { bento: A('吃池上便當', 30, { hunger: 2.6, fun: 0.1 }, { cost: 100 }) } },

<script>
/* 模組 2／5：人生模擬 — 時間、需求、動作佇列、上班規則（打卡、上午公所下午駐村）、案件、薪水開銷、考績升遷、
   人際關係與家庭、健康老化與死亡、隨機事件、自動生活、存檔 */
(function () {
'use strict';
const D = window.D;
const U = window.U = {
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v), rand: (a, b) => a + Math.random() * (b - a), ri: (a, b) => Math.floor(a + Math.random() * (b - a + 1)), pick: a => a[Math.floor(Math.random() * a.length)],
  fmt: n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','),
  hm: m => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(Math.floor(m % 60)).padStart(2, '0')}`,
};
const S = window.S = {};
const SIM = window.SIM = { ev: [] };
const emit = o => SIM.ev.push(o);

/* ---------- 新人生 ---------- */
SIM.newLife = function (o) {
  for (const k of Object.keys(S)) delete S[k];
  Object.assign(S, {
    v: 1, name: o.name, g: o.g, look: o.look, age: o.age, day: 0, min: 6 * 60 + 30, loc: 'home', x: 0.2, face: 1, walkTo: null,
    needs: { hunger: 70, energy: 85, hygiene: 80, social: 60, fun: 60 }, stress: 25, health: 92,
    sk: { admin: 0, law: 0, talk: 0, lang: o.lang ? 20 : 0, body: 10, cook: 5 },
    money: 30000, rank: 0, step: 0, years: 0, perf: 0, grades: [], clocked: false, clockOut: false, late: 0, absent: 0, early: 0, retired: false, examYear: -1, rankYears: 0,
    tasks: [], trust: 40, visits: 0, visitGoal: 120, rel: {}, spouse: null, kids: [], house: 'rent', upgrades: {},
    queue: [], cur: null, log: [], flags: {}, eventQ: [], typhoon: 0, sickT: 0, ill: null,
    stats: { cases: 0, visits: 0, helped: 0, overtime: 0, festivals: 0, fails: 0, workDays: 0, gradeA: 0, kills: 0 },
    dead: null, auto: false, autoFull: false,
  });
  for (const k in D.NPCS) S.rel[k] = { v: k === 'chief' || k === 'head' ? 10 : 0, met: ['chief', 'head', 'coworker', 'coworker2'].includes(k), stage: '' };
  SIM.log(`民國 ${D.START_YEAR} 年 1 月，${S.name} 錄取池上鄉公所，派任原住民族事務所，兼大埔村村幹事。今天是第一天上班！`, 'big');
  SIM.queueEvent('first_day');
  SIM.genTasks(SIM.cal()); SIM.addTask('doc', { due: 2 }); SIM.addTask('visit', { due: 5 });
};

/* ---------- 時間與日曆 ---------- */
SIM.cal = (day = S.day) => { const y = Math.floor(day / D.YEAR_DAYS), m = Math.floor((day % D.YEAR_DAYS) / D.MONTH_DAYS) + 1, d = day % D.MONTH_DAYS + 1; return { y: D.START_YEAR + y, yi: y, m, d, w: d - 1, weekend: d >= 6 }; };
SIM.isWorkday = (day = S.day) => { const c = SIM.cal(day); if (c.weekend) return false; if (c.m === 2 && c.d <= 2) return false; /* 春節連假 */ if (c.m === 4 && c.d === 1) return false; /* 清明 */ return !S.retired; };
SIM.workHours = () => SIM.isWorkday() && S.min >= 8 * 60 && S.min < 17.5 * 60;
SIM.lunch = () => S.min >= 12 * 60 && S.min < 13.5 * 60;
SIM.dateStr = () => { const c = SIM.cal(); return `${c.y} 年 ${c.m} 月 第 ${c.d} 天（週${D.WEEK[c.w]}）`; };
SIM.log = function (m, kind) { S.log.push({ d: S.day, t: S.min, m, kind }); if (S.log.length > 160) S.log.shift(); emit({ k: 'log', m, kind }); };

/* ---------- 技能 ---------- */
SIM.lv = k => Math.min(10, Math.floor(Math.sqrt((S.sk[k] || 0) / 12)));
SIM.addSk = function (k, v) { const a = SIM.lv(k); S.sk[k] = (S.sk[k] || 0) + v; const b = SIM.lv(k); if (b > a) { SIM.log(`${D.SKILLS[k].n} 升到 ${b} 級！`, 'good'); emit({ k: 'skill', s: k, lv: b }); } };

/* ---------- 心情 ---------- */
SIM.mood = function () { const n = S.needs; const avg = (n.hunger + n.energy + n.hygiene + n.social + n.fun) / 5; return U.clamp(avg - S.stress * 0.35 + (S.health - 70) * 0.15 + (S.spouse ? 5 : 0), 0, 100); };
SIM.moodName = () => { const m = SIM.mood(); return m > 75 ? '心情很好' : m > 55 ? '還不錯' : m > 35 ? '有點累' : m > 18 ? '心情低落' : '快撐不住了'; };

/* ---------- 動作 ---------- */
/* 動作結構：{ kind: 'obj'|'task'|'npc'|'go', loc, obj, act, task, npc, n } */
SIM.push = function (a, front) {
  if (S.dead) return;
  if (S.queue.length >= 5 && !front) { emit({ k: 'toast', m: '待辦動作最多 5 個' }); return; }
  if (front) S.queue.unshift(a); else S.queue.push(a);
  emit({ k: 'queue' });
};
SIM.cancel = function (i) { if (i === -1) { if (S.cur && S.cur.sleep && S.min > 4 * 60 && S.min < 22 * 60) { /* 可以叫醒 */ } S.cur = null; } else S.queue.splice(i, 1); emit({ k: 'queue' }); };
SIM.objOf = (loc, id) => (D.OBJ[loc] || []).find(o => o.id === id);
/* 目前要執行的動作 → 決定需要移動或走路 */
SIM.begin = function () {
  const a = S.queue[0]; if (!a) return;
  if (a.kind === 'go') { S.queue.shift(); SIM.startTravel(a.loc); return; }
  if (a.loc && a.loc !== S.loc) { SIM.startTravel(a.loc); return; }
  const o = SIM.objOf(S.loc, a.obj);
  const tx = o ? (o.npc ? o.x - 0.075 : o.x) : S.x;
  if (Math.abs(tx - S.x) > 0.02) { S.walkTo = tx; return; }
  S.queue.shift();
  /* 開始動作 */
  if (a.kind === 'obj') {
    const act = o.acts[a.act]; if (!act) return;
    if (act.cost && S.money < act.cost) { SIM.log('錢不夠了……', 'bad'); return; }
    if (act.clock === 'in') return SIM.clockIn();
    if (act.clock === 'out') return SIM.clockOut();
    if (act.sleep && S.min > 9 * 60 && S.min < 19 * 60) { emit({ k: 'toast', m: '現在不是睡覺時間，試試小睡' }); return; }
    if (act.cost) S.money -= act.cost;
    let dur = act.dur;
    if (act.sleep) { const wake = SIM.isWorkday(S.min < 6 * 60 ? S.day : S.day + 1) ? 6.5 * 60 : 8 * 60; dur = ((wake - S.min) + 1440) % 1440 || 480; dur = U.clamp(dur, 60, 720); }
    S.cur = { kind: 'obj', obj: a.obj, act: a.act, n: act.n, left: dur, tot: dur, e: act.e, sk: act.sk, sleep: act.sleep, heal: act.heal, checkup: act.checkup, rel: act.rel ? [o.npc, act.rel] : null };
  } else if (a.kind === 'task') {
    const t = S.tasks.find(q => q.uid === a.uid); if (!t) return;
    const T = D.TASK[t.id];
    if (!SIM.isWorkday()) { emit({ k: 'toast', m: '今天放假，公務等上班日再處理' }); return; }
    if (!S.clocked) { emit({ k: 'toast', m: '先到公所打卡上班' }); return; }
    if (S.clockOut) { emit({ k: 'toast', m: '已經打卡下班了，明天再處理' }); return; }
    S.cur = { kind: 'task', uid: t.uid, n: T.n, left: T.t, tot: T.t, e: { energy: -0.05, stress: 0.06, fun: -0.03 } };
  } else if (a.kind === 'npc') {
    const N = D.NPCS[a.npc] || { n: '路人' };
    const m = { chat: ['聊天', 25, { social: 1.4, fun: 0.3 }], ask: ['請教問題', 30, { social: 0.6 }], gift: ['送伴手禮', 10, { social: 0.6 }], meal: ['一起吃飯', 70, { social: 1.2, hunger: 1.6, fun: 0.4 }], confess: ['告白', 15, { social: 0.5 }], propose: ['求婚', 20, { social: 0.5 }], lang: ['請教族語', 40, { social: 0.6 }] }[a.act];
    if (a.act === 'gift' && S.money < 500) { SIM.log('錢不夠買伴手禮', 'bad'); return; }
    if (a.act === 'meal' && S.money < 400) { SIM.log('錢不夠吃飯', 'bad'); return; }
    S.cur = { kind: 'npc', npc: a.npc, act: a.act, n: `${m[0]}：${N.n}`, left: m[1], tot: m[1], e: m[2] };
  }
  emit({ k: 'queue' });
};
SIM.startTravel = function (to) {
  const t = Math.round(D.travel(S.loc, to) * (S.upgrades.scooter ? 0.75 : 1));
  S.cur = { kind: 'travel', to, n: `騎機車前往${D.LOCS[to].n}`, left: t, tot: t, e: { energy: -0.03 } };
  /* 太累騎車可能出事 */
  if (S.needs.energy < 12 && Math.random() < 0.05) S.cur.crash = 1;
  emit({ k: 'queue' });
};
SIM.finish = function () {
  const c = S.cur; S.cur = null;
  if (c.kind === 'travel') {
    S.loc = c.to; S.x = 0.05; S.walkTo = null;
    if (c.crash) { S.health -= 25; S.stress += 20; SIM.log('太疲倦騎車，在台9線旁跌倒受傷了……', 'bad'); SIM.queueEvent('crash'); }
    emit({ k: 'arrive', loc: c.to });
    return;
  }
  if (c.kind === 'obj') {
    if (c.heal) { if (S.ill) { SIM.log(`看完醫生，${S.ill.n}好多了。`, 'good'); S.ill = null; } S.health = Math.min(100, S.health + 4); }
    if (c.checkup) { SIM.log(`健康檢查結果：健康指數 ${Math.round(S.health)}。${S.health < 55 ? '醫生要你多休息、多運動。' : '大致正常。'}`, S.health < 55 ? 'bad' : 'good'); S.flags.checkupYear = SIM.cal().yi; }
    if (c.sleep) SIM.log(`睡醒了，${U.hm(S.min)}。`, '');
    if (c.rel) { SIM.rel(c.rel[0], c.rel[1]); SIM.addSk('admin', 0.5); }
    return;
  }
  if (c.kind === 'task') return SIM.taskDone(c.uid);
  if (c.kind === 'npc') return SIM.npcDone(c.npc, c.act);
};

/* ---------- 打卡 ---------- */
SIM.clockIn = function () {
  if (!SIM.isWorkday()) { emit({ k: 'toast', m: '今天放假喔' }); return; }
  if (S.clocked) { emit({ k: 'toast', m: '已經打過卡了' }); return; }
  if (S.min < 7 * 60) { emit({ k: 'toast', m: '公所還沒開門（7:00 以後才能打卡）' }); return; }
  S.clocked = true; S.stats.workDays++;
  if (S.min > 8 * 60 + 5) { S.late++; S.perf -= 2; SIM.rel('chief', -2); SIM.log(`遲到了！${U.hm(S.min)} 才打卡。`, 'bad'); }
  else SIM.log(`${U.hm(S.min)} 打卡上班。`, '');
  emit({ k: 'sfx', s: 'clock' });
};
SIM.clockOut = function () {
  if (!S.clocked) { emit({ k: 'toast', m: '今天還沒打上班卡' }); return; }
  if (S.clockOut) { emit({ k: 'toast', m: '已經打過下班卡了' }); return; }
  if (S.min < 17.5 * 60) { S.early++; S.perf -= 2; SIM.rel('chief', -3); SIM.log('提早下班，被記早退……', 'bad'); }
  else if (S.min > 19 * 60) { S.stats.overtime++; SIM.log('加班到現在，終於下班了。', ''); }
  else SIM.log(`${U.hm(S.min)} 打卡下班。`, '');
  S.clockOut = true; emit({ k: 'sfx', s: 'clock' });
};

/* ---------- 案件 ---------- */
let TUID = 1;
SIM.addTask = function (id, o) {
  const T = D.TASK[id]; if (!T || S.retired) return;
  if (S.tasks.filter(t => !t.fixed).length >= 12 && !T.fixed) return;
  const t = Object.assign({ uid: TUID++, id, left: T.n2, due: S.day + T.due, from: S.day, fixed: T.fixed }, o || {});
  S.tasks.push(t);
  return t;
};
SIM.taskAt = function (t) { const [loc, obj] = D.TASK[t.id].at.split('.'); return { loc, obj }; };
SIM.tasksFor = function (loc, obj, kind) {
  /* 物件上可以做的案件（住戶甲乙丙都算 house） */
  return S.tasks.filter(t => { const a = SIM.taskAt(t); const site = t.site && t.left === 1 ? D.TASK[t.id].site.split('.') : null; const L = site ? site[0] : a.loc, O = site ? site[1] : a.obj; return L === loc && (O === obj || (O === 'house' && kind === 'house') || O === kind); });
};
SIM.taskDone = function (uid) {
  const t = S.tasks.find(q => q.uid === uid); if (!t) return;
  const T = D.TASK[t.id];
  const sk = SIM.lv(T.sk);
  let ok = 0.72 + sk * 0.03 - Math.max(0, S.stress - 60) / 200 - (S.needs.energy < 15 ? 0.15 : 0) + (SIM.lv('law') * 0.01);
  if (T.sk === 'lang' && sk < 2) ok -= 0.05;
  SIM.addSk(T.sk, 2.4); SIM.addSk('admin', 0.8);
  if (Math.random() > ok) {
    S.stats.fails++; S.stress += 4;
    SIM.log(`「${T.n}」出了點差錯（${U.pick(['文件少附一份', '金額算錯', '漏蓋章', '民眾不滿意說明'])}），要重做一次。`, 'bad');
    emit({ k: 'fail' });
    return;
  }
  t.left--;
  if (t.left > 0) { SIM.log(`「${T.n}」完成一個階段，還剩 ${t.left} 次。`, ''); emit({ k: 'step' }); return; }
  S.tasks = S.tasks.filter(q => q !== t);
  const late = S.day > t.due;
  S.perf += T.pts * (late ? 0.5 : 1); S.trust = U.clamp(S.trust + T.trust * (late ? 0.4 : 1), 0, 100); S.stats.cases++;
  if (t.id === 'visit' || t.id === 'visit_poor' || t.id === 'elderly') { S.visits += t.id === 'visit' ? 4 : 1; S.stats.visits++; }
  if (t.id.startsWith('aid') || t.id === 'house_fix' || t.id === 'visit_poor') S.stats.helped++;
  if (t.id === 'ilisin') S.stats.festivals++;
  if (t.id === 'meet') S.flags.meetDone = S.day;
  if (t.id === 'tribe_meet' || t.id === 'ilisin' || t.id === 'care_visit') SIM.rel('elder', 3);
  if (t.id === 'neighbor' || t.id === 'cert' || t.id === 'visit') SIM.rel('head', 2);
  SIM.log(`完成「${T.n}」${late ? '（逾期）' : ''}。績效 +${(T.pts * (late ? 0.5 : 1)).toFixed(0)}`, late ? '' : 'good');
  emit({ k: 'done', t: t.id });
  /* 案件後續的小故事 */
  if (Math.random() < 0.18) SIM.queueEvent(U.pick(['thanks', 'gift_rice', 'angry_citizen', 'paper_more']));
};

/* ---------- 人際 ---------- */
SIM.rel = function (k, v) { const r = S.rel[k]; if (!r) return; r.v = U.clamp(r.v + v, -100, 100); r.met = true; };
SIM.npcDone = function (k, act) {
  const N = D.NPCS[k], r = S.rel[k] || { v: 0 };
  const talk = SIM.lv('talk');
  if (k === 'random') { SIM.addSk('talk', 1); SIM.log(U.pick(['和遛狗的阿姨聊了今年稻子的收成。', '遇到騎單車的遊客問路，熱心幫他們指路。', '和釣魚的阿伯聊起以前大坡池的樣子。']), ''); return; }
  switch (act) {
    case 'chat': SIM.rel(k, 3 + talk * 0.4); SIM.addSk('talk', 1.2); SIM.log(`和${N.n}聊了一會兒。`, ''); break;
    case 'ask': SIM.rel(k, 2); SIM.addSk('law', 2); SIM.log(`向${N.n}請教業務上的問題，學到不少。`, 'good'); break;
    case 'lang': SIM.rel(k, 4); SIM.addSk('lang', 3); SIM.log(`${N.n}教你幾句阿美族語：Nga'ay ho（你好）、Aray（謝謝）。`, 'good'); break;
    case 'gift': S.money -= 500; SIM.rel(k, 8); SIM.log(`送了${N.n}一盒池上米餅。`, ''); break;
    case 'meal': S.money -= 400; SIM.rel(k, 7); SIM.log(`和${N.n}一起吃飯，聊得很開心。`, 'good'); break;
    case 'confess':
      if (r.v >= 55 && !S.spouse && Math.random() < 0.4 + r.v / 200) { r.stage = 'dating'; SIM.log(`${N.n}答應和你交往了！`, 'big'); emit({ k: 'love' }); }
      else { SIM.rel(k, -6); S.stress += 8; SIM.log(`${N.n}說還想再多了解你一點……`, 'bad'); }
      break;
    case 'propose':
      if (r.stage === 'dating' && r.v >= 80 && Math.random() < 0.75) { r.stage = 'married'; S.spouse = k; S.money -= 150000; SIM.log(`${N.n}答應你的求婚了！你們在池上辦了一場溫馨的婚禮（花費 15 萬）。`, 'big'); SIM.queueEvent('wedding'); }
      else { SIM.rel(k, -8); S.stress += 10; SIM.log(`${N.n}覺得還沒準備好。`, 'bad'); }
      break;
  }
};

/* ---------- 每分鐘 ---------- */
SIM.tick = function (mins) {
  for (let i = 0; i < mins && !S.dead; i++) SIM.minute();
};
SIM.minute = function () {
  const c = S.cur, n = S.needs;
  const prev = S.min;
  S.min++;
  if (S.min >= 1440) { S.min = 0; SIM.newDay(); }
  /* 需求自然變化 */
  const sleeping = c && c.sleep;
  for (const k in D.NEEDS) n[k] -= D.NEEDS[k].dec / 60 * (sleeping ? (k === 'energy' ? 0 : 0.35) : 1) * (S.ill && k === 'energy' ? 1.6 : 1);
  if (S.spouse && S.loc === 'home') n.social += 0.02;
  /* 正在做的事 */
  if (c) {
    const e = c.e || {};
    for (const k in e) { if (k === 'stress') S.stress += e[k]; else n[k] += e[k] * (k === 'energy' && sleeping && S.upgrades.bed ? 1.2 : 1); }
    if (c.sk) for (const k in c.sk) SIM.addSk(k, c.sk[k] / 60 * (k === 'law' && S.upgrades.books ? 1.5 : 1));
    if (sleeping && S.upgrades.aircon) S.stress -= 0.01;
    if (c.kind === 'task') S.stress += 0.03;
    if (c.kind === 'npc') S.stress -= 0.03;
    c.left--;
    if (c.left <= 0) SIM.finish();
  } else if (S.walkTo == null) SIM.begin();
  for (const k in n) n[k] = U.clamp(n[k], 0, 100);
  /* 壓力與健康 */
  if (SIM.workHours() && S.clocked && !S.clockOut) S.stress += 0.012 + Math.max(0, S.tasks.filter(t => S.day > t.due).length) * 0.004;
  else S.stress -= 0.01;
  if (n.fun > 60) S.stress -= 0.008;
  S.stress = U.clamp(S.stress, 0, 100);
  if (n.hunger <= 0) S.health -= 0.01; if (n.energy <= 0) S.health -= 0.01;
  if (S.stress > 85) S.health -= 0.002;
  if (c && c.kind === 'obj' && (c.act === 'jog' || c.act === 'ride' || c.act === 'walk')) S.health = Math.min(100, S.health + 0.004);
  if (S.ill) { S.health -= 0.0015; }
  /* 精力歸零會昏睡 */
  if (n.energy <= 0 && !sleeping && (!c || c.kind !== 'travel')) { S.cur = { kind: 'obj', obj: 'faint', act: 'faint', n: '累到睡著了', left: 180, tot: 180, e: { energy: 0.3 } }; SIM.log('撐不住，就地睡著了……', 'bad'); S.queue = []; }
  /* 上班時間檢查 */
  if (SIM.isWorkday()) {
    if (prev < 10 * 60 && S.min >= 10 * 60 && !S.clocked) { S.perf -= 4; SIM.rel('chief', -5); SIM.log('已經十點了還沒到公所，所長打電話來關心……', 'bad'); emit({ k: 'phone' }); }
    if (S.min === 12 * 60 + 30 && S.clocked && S.loc !== 'office' && S.loc !== 'town' && S.loc !== 'vo') { /* 午休 */ }
    if (S.min >= 14 * 60 && S.min < 17 * 60 && S.clocked && !S.clockOut && (S.loc === 'home' || S.loc === 'lake') && Math.random() < 0.002) { S.perf -= 3; SIM.rel('chief', -4); SIM.log('上班時間被看到在外面閒晃，所長有點不高興。', 'bad'); }
    if (S.min === 9 * 60 && S.tasks.some(t => t.id === 'meet' && t.due === S.day) && S.loc !== 'office') SIM.log('工作會報九點開始，快去會議室！', 'bad');
  }
  /* 健康與死亡 */
  if (S.health <= 0) SIM.die(S.age > 70 ? '年老體衰' : S.ill ? `${S.ill.n}惡化` : '身體長期透支');
};

/* ---------- 每日 ---------- */
SIM.newDay = function () {
  const yesterday = S.day;
  /* 昨天的出勤 */
  if (SIM.isWorkday(yesterday)) {
    if (!S.clocked) { S.absent++; S.perf -= 8; SIM.rel('chief', -10); SIM.log('昨天沒有到班，被記曠職一天。', 'bad'); }
    else if (!S.clockOut) { S.perf -= 1; SIM.log('昨天忘了打下班卡，被人事室提醒。', 'bad'); }
  }
  S.day++; S.clocked = false; S.clockOut = false; S.flags.docToday = 0;
  const c = SIM.cal();
  S.age += 1 / D.YEAR_DAYS;
  /* 老化：每天一點點 */
  const a = S.age; S.health -= (a > 75 ? 0.045 : a > 60 ? 0.024 : a > 45 ? 0.012 : 0.003);
  if (S.stress < 45 && !S.ill) S.health = Math.min(a < 50 ? 96 : a < 65 ? 88 : 80, S.health + (a < 60 ? 0.05 : 0.02));
  if (S.ill && --S.ill.d <= 0) { SIM.log(`${S.ill.n}好了。`, 'good'); S.ill = null; }
  /* 逾期案件 */
  for (const t of S.tasks) if (S.day > t.due + 0 && !t.warned) { t.warned = 1; S.perf -= 1; S.trust = Math.max(0, S.trust - 1); }
  S.tasks = S.tasks.filter(t => !(t.fixed && S.day > t.due + 1));
  /* 月初：薪水與開銷 */
  if (c.d === 1) SIM.month(c);
  /* 每日新案件 */
  if (SIM.isWorkday()) SIM.genTasks(c);
  /* 颱風 */
  if (S.typhoon > 0) { S.typhoon--; if (!S.typhoon) { SIM.log('颱風遠離了，開始調查農損。', ''); SIM.addTask('crop_loss'); SIM.addTask('report'); } }
  /* 隨機事件 */
  SIM.dailyEvents(c);
  /* 小孩 */
  for (const k of S.kids) k.age += 1 / D.YEAR_DAYS;
  /* 自然死亡風險 */
  if (a > 68) { const hz = 0.00008 * Math.exp((a - 67) / 5.5) * (1.6 - S.health / 100); if (Math.random() < hz) SIM.die('壽終正寢'); }
  emit({ k: 'day' });
};
SIM.month = function (c) {
  const R = D.RANKS[S.rank];
  let pay = S.retired ? Math.round(D.RANKS[S.rank].pay * (0.45 + Math.min(0.3, S.years * 0.01))) : R.pay + S.step * 1100 + Math.floor(S.years) * 120;
  S.money += pay;
  let cost = (S.house === 'rent' ? 6500 : 0) + (S.house === 'loan' ? 16000 : 0) + 15000 + S.kids.filter(k => k.age < 22).length * 9000 + (S.age > 70 ? 4000 : 0);
  cost = Math.round(cost * (1 + c.yi * 0.012));
  S.money -= cost;
  if (S.spouse && S.spouse !== 'gone') { const sp = S.age < 65 ? 18000 : 8000; S.money += sp; }
  if (S.house === 'loan') { S.loanLeft = (S.loanLeft || 240) - 1; if (S.loanLeft <= 0) { S.house = 'own'; SIM.log('房貸繳清了！房子完全是你的了。', 'big'); } }
  SIM.log(`${c.m} 月 ${S.retired ? '月退俸' : '薪水'}入帳 ${U.fmt(pay)} 元，房租、水電、伙食、保險等開銷 ${U.fmt(cost)} 元。`, '');
  if (S.money < 0) { S.stress += 6; SIM.log('存款變成負的了，壓力好大……', 'bad'); }
  /* 年底考績 */
  if (c.m === 1 && S.day >= D.YEAR_DAYS) SIM.yearEnd();
  /* 固定會議 */
  /* 選舉 */
  const yi = c.yi;
  if (!S.retired && c.m === 10 && (yi % 4 === 0)) { SIM.addTask('election'); SIM.log('今年是地方公職人員選舉年，選務工作開始了。', ''); }
  if (!S.retired && c.m === 12 && (yi % 4 === 1)) { SIM.addTask('election'); SIM.log('明年一月要舉行總統副總統與立委選舉，選務工作開始了。', ''); }
  /* 生日 */
  if (c.m === 3) emit({ k: 'toast', m: `${Math.floor(S.age)} 歲了` });
  /* 結婚後可能有孩子 */
  if (S.spouse && S.kids.length < 3 && S.age < 46 && !S.flags.babyAsk && S.day - (S.flags.lastBaby || 0) > D.YEAR_DAYS * 2 && Math.random() < 0.12) { S.flags.babyAsk = 1; SIM.queueEvent('baby'); }
  if (S.flags.babyDue && S.day >= S.flags.babyDue) { S.flags.babyDue = 0; const g = Math.random() < 0.5 ? 'm' : 'f'; const nm = U.pick(g === 'm' ? ['小宇', '小翔', '阿浩', '小安'] : ['小晴', '小語', '小米', '小穗']); S.kids.push({ n: nm, g, age: 0 }); SIM.log(`${nm} 出生了！你當${S.g === 'm' ? '爸爸' : '媽媽'}了。`, 'big'); SIM.queueEvent('born'); S.flags.babyAsk = 0; S.flags.lastBaby = S.day; }
};
SIM.yearEnd = function () {
  const y = SIM.cal().y - 1;
  if (S.retired) return;
  S.years++; S.rankYears++;
  const score = S.perf - S.absent * 25 - S.late * 6 - S.early * 6 + (S.visits >= S.visitGoal ? 40 : -60) + S.rel.chief.v * 0.8;
  let g = score >= 560 ? '甲' : score >= 280 ? '乙' : '丙';
  if (g === '甲' && Math.random() < 0.15) { g = '乙'; SIM.log('甲等名額有限，今年所長把甲等給了其他同仁……', 'bad'); }
  S.grades.push(g);
  let bonus = 0; const R = D.RANKS[S.rank];
  if (g === '甲') { bonus = R.pay * 1.5; S.step++; S.stats.gradeA++; }
  else if (g === '乙') { bonus = R.pay; S.step++; }
  S.money += bonus;
  SIM.log(`${y} 年考績：${g}等（年度績效 ${Math.round(score)}）。考績獎金 ${U.fmt(bonus)} 元。`, g === '甲' ? 'big' : g === '丙' ? 'bad' : '');
  emit({ k: 'grade', g, score: Math.round(score) });
  /* 升遷：同官等內 */
  const last2 = S.grades.slice(-2), last3 = S.grades.slice(-3);
  if (S.rank < 2 && S.rankYears >= 1 && (last2.every(x => x === '甲') || (last3.length === 3 && last3.filter(x => x === '甲').length >= 1 && last3.indexOf('丙') < 0))) SIM.promote();
  else if (S.rank === 3 && S.rankYears >= 3 && last2.every(x => x === '甲')) SIM.promote();
  else if (S.rank === 4 && S.rankYears >= 3 && S.age >= 38 && last3.filter(x => x === '甲').length >= 2 && S.trust > 65 && Math.random() < 0.22) SIM.promote('所長退休，你被拔擢為原民所所長！');
  S.perf = 0; S.late = 0; S.absent = 0; S.early = 0; S.visits = 0; S.stress += 5;
};
SIM.promote = function (m) { S.rank++; S.rankYears = 0; S.step = 0; const R = D.RANKS[S.rank]; SIM.log(m || `升任${R.n}（${R.grade}）！`, 'big'); SIM.queueEvent('promote'); };
SIM.genTasks = function (c) {
  /* 固定：每月兩次工作會報、一次鄰長會議、每季部落會議 */
  if (c.d === 2 || c.d === 4) SIM.addTask('meet', { due: S.day, fixed: 1 });
  if (c.d === 3) SIM.addTask('neighbor', { due: S.day + 2, fixed: 1 });
  if (c.d === 1 && c.m % 3 === 1) SIM.addTask('tribe_meet', { due: S.day + 4, fixed: 1 });
  for (const T of D.TASKS) {
    if (!T.p) continue;
    if (T.when && !T.when.includes(c.m)) continue;
    let p = T.p * 0.55;
    if (T.id === 'visit' && S.visits < S.visitGoal * ((c.m) / 12)) p += 0.25;
    if (Math.random() < p && S.tasks.filter(t => t.id === T.id).length < 2) SIM.addTask(T.id);
  }
};

/* ---------- 隨機事件 ---------- */
SIM.queueEvent = id => { if (!S.eventQ.includes(id)) S.eventQ.push(id); };
SIM.dailyEvents = function (c) {
  const r = Math.random;
  if ((c.m >= 7 && c.m <= 9) && !S.typhoon && r() < 0.05) SIM.queueEvent('typhoon');
  if (c.m === 3 && c.d === 1 && !S.retired && S.rank === 2 && S.examYear !== c.yi) SIM.queueEvent('exam');
  if (c.m === 7 && c.d === 1 && S.flags.examSigned === c.yi) SIM.queueEvent('exam_result');
  if ((c.m === 12 || c.m <= 2) && r() < 0.04 && !S.ill) SIM.queueEvent('flu');
  if (S.age > 45 && r() < 0.004 && !S.flags.chronic && S.stress > 50) SIM.queueEvent('chronic');
  if (r() < 0.06) SIM.queueEvent(U.pick(['coworker_dinner', 'chief_extra', 'head_favor', 'elder_story', 'family_call', 'stray_dog', 'power_cut', 'tourist']));
  if (!S.spouse && S.age < 45 && r() < 0.03) SIM.queueEvent('crush');
  if (c.m === 7 && c.d === 2) SIM.queueEvent('ilisin_invite');
  if (c.m === 10 && c.d === 2) SIM.queueEvent('rice_festival');
  if (!S.retired && S.age >= D.RETIRE_AGE) SIM.queueEvent('retire_must');
  else if (!S.retired && S.age >= 60 && S.years >= 25 && !S.flags.retireAsked) { S.flags.retireAsked = 1; SIM.queueEvent('retire_opt'); }
  if (S.kids.some(k => k.age >= 22 && !k.left)) SIM.queueEvent('kid_leave');
  if (S.spouse && S.age > 70 && r() < 0.002) SIM.queueEvent('spouse_ill');
  if (S.house === 'rent' && S.money > 900000 && !S.flags.houseAsk) { S.flags.houseAsk = 1; SIM.queueEvent('house'); }
};
/* 事件：c 條件、t 標題、x 內文、o 選項 [文字, 結果函式] */
const npcN = k => D.NPCS[k].n;
SIM.EVENTS = {

  tourist: { t: '遊客問路', x: () => '一群騎單車的遊客迷路了，問你伯朗大道怎麼走，還想知道哪裡吃得到池上便當。', o: [['熱心介紹', () => { S.needs.social += 10; SIM.addSk('talk', 1); }]] },

  rice_festival: { t: '秋收稻穗藝術節', x: () => '金黃的稻田裡搭起舞台，全鄉動員迎接遊客。你被分配到交通疏導。', o: [['全力支援', () => { SIM.addTask('festival'); S.perf += 2; }]] },

  promote: { t: '升遷', x: () => `你升任 ${D.RANKS[S.rank].n}（${D.RANKS[S.rank].grade}）。`, o: [['會更努力', () => { S.stress -= 10; }]] },
  crash: { t: '機車意外', x: () => '疲勞騎車，一個不注意就摔車了。還好沒有大礙，但膝蓋擦傷、手腕扭到。', o: [['以後太累就不騎車', () => {}]] },
  house: { t: '要不要買房？', x: () => '存了一筆錢，鄉內有一間老透天在賣。頭期款 60 萬，之後每月房貸約 1.6 萬，繳 20 年。', o: [['買！', () => { S.money -= 600000; S.house = 'loan'; S.loanLeft = 240; SIM.log('買下了自己的房子！', 'big'); }], ['繼續租房', () => {}]] },
  retire_opt: { t: '可以申請退休了', x: () => `你已經服務 ${S.years} 年，符合自願退休條件。要退休嗎？`, o: [['申請退休', () => SIM.retire()], ['再做幾年', () => {}]] },
  retire_must: { t: '屆齡退休', x: () => `你滿 ${D.RETIRE_AGE} 歲了，依規定屆齡退休。同事們為你辦了歡送會。`, o: [['謝謝大家這些年的照顧', () => SIM.retire()]] },
  kid_leave: { t: '孩子長大了', x: () => { const k = S.kids.find(q => q.age >= 22 && !q.left); k.left = 1; return `${k.n} 要去外地工作了。`; }, o: [['保重！', () => { S.needs.social -= 20; }]] },
  spouse_ill: { t: '家人生病', x: () => `${npcN(S.spouse)}住院了，需要照顧。`, o: [['請假陪伴', () => { S.stress += 15; S.money -= 30000; }]] },
};
SIM.retire = function () { S.retired = true; S.tasks = []; S.clocked = false; SIM.log(`退休了。服務 ${S.years} 年，之後每月領月退俸。`, 'big'); emit({ k: 'retired' }); };
SIM.choose = function (id, i) { const E = SIM.EVENTS[id]; if (!E) return; const o = E.o[i]; if (o) o[1](); S.trust = U.clamp(S.trust, 0, 100); S.stress = U.clamp(S.stress, 0, 100); for (const k in S.needs) S.needs[k] = U.clamp(S.needs[k], 0, 100); emit({ k: 'chosen' }); };

/* ---------- 死亡 ---------- */
SIM.die = function (cause) {
  if (S.dead) return;
  S.dead = { cause, age: Math.floor(S.age), date: SIM.dateStr() };
  S.cur = null; S.queue = [];
  emit({ k: 'dead' });
};

/* ---------- 購物 ---------- */
D.SHOP = [
  { id: 'bed', n: '獨立筒床墊', price: 18000, d: '睡眠回復精力快 20%' },
  { id: 'scooter', n: '新機車', price: 75000, d: '移動時間減少 25%' },
  { id: 'books', n: '法規工具書全套', price: 6000, d: '讀書學法規快 50%' },
  { id: 'aircon', n: '冷氣', price: 32000, d: '夏天睡得比較好，壓力恢復更快' },
];
SIM.buy = function (id) { const it = D.SHOP.find(x => x.id === id); if (!it || S.upgrades[id]) return 'have'; if (S.money < it.price) return 'money'; S.money -= it.price; S.upgrades[id] = 1; SIM.log(`買了${it.n}。`, 'good'); return 'ok'; };

/* ---------- 自動生活（AI 代理） ---------- */
SIM.autoPlan = function () {
  if (S.dead || S.cur || S.queue.length || S.walkTo != null || S.eventQ.length) return;
  const n = S.needs, m = S.min, work = SIM.isWorkday() && !S.retired, H = m / 60;
  const go = (loc, obj, act) => SIM.push({ kind: 'obj', loc, obj, act });
  /* 睡覺 */
  if (H >= 22.5 || H < 6) { if (n.hygiene < 70 && S.loc === 'home') return go('home', 'bath', 'shower'); return go('home', 'bed', 'sleep'); }
  if (n.energy < 12) return S.loc === 'home' ? go('home', 'bed', 'nap') : go('town', 'store', 'coffee');
  if (work && !S.clocked && H >= 6.5 && H < 17) {
    if (n.hunger < 55 && S.loc === 'home' && H < 7.6) return go('home', 'kitchen', 'snack');
    if (n.hygiene < 50 && S.loc === 'home' && H < 7.6) return go('home', 'bath', 'shower');
    return go('office', 'clock', 'clockin');
  }
  if (work && S.clocked && !S.clockOut) {
    if (H >= 17.5) return go('office', 'clock', 'clockout');
    if (SIM.lunch() && n.hunger < 60) return go('town', 'bento', 'bento');
    if (n.hunger < 18) return go('town', 'store', 'onigiri');
    /* 有期限的先做；上午偏公所、下午偏村裡 */
    const am = H < 12;
    const list = S.tasks.slice().sort((a, b) => {
      const A1 = SIM.taskAt(a), B1 = SIM.taskAt(b);
      const sa = (a.fixed && a.due === S.day ? -100 : 0) + a.due + ((A1.loc === 'office') === am ? 0 : 3) + (A1.loc === S.loc ? -1 : 0);
      const sb = (b.fixed && b.due === S.day ? -100 : 0) + b.due + ((B1.loc === 'office') === am ? 0 : 3) + (B1.loc === S.loc ? -1 : 0);
      return sa - sb;
    });
    const t = list[0];
    if (t) { const at = SIM.taskAt(t); const site = t.site && t.left === 1 ? D.TASK[t.id].site.split('.') : null; const loc = site ? site[0] : at.loc; const ob = site ? site[1] : at.obj; const obj = ob === 'house' ? U.pick(['house1', 'house2', 'house3']) : ob === 'street' ? 'lamp' : ob; return SIM.push({ kind: 'task', uid: t.uid, loc, obj }); }
    /* 沒案子：下午到村辦公處坐班，上午整理公文 */
    if (!am && S.loc !== 'vo') return SIM.push({ kind: 'go', loc: 'vo' });
    if (S.loc === 'office') return SIM.push({ kind: 'npc', npc: 'chief', act: 'ask', loc: 'office', obj: 'chief' });
    if (S.loc === 'vo') return SIM.push({ kind: 'npc', npc: 'head', act: 'chat', loc: 'vo', obj: 'head' });
    return SIM.push({ kind: 'go', loc: 'office' });
  }
  /* 下班與假日 */
  if (S.ill && !S.flags.docToday && H < 20) { S.flags.docToday = 1; return go('town', 'clinic', 'doctor'); }
  /* 週末約會（全自動時） */
  if (!work && !S.spouse && S.age < 46 && H > 10 && H < 19 && Math.random() < 0.25) {
    const ks = Object.keys(D.NPCS).filter(k => D.NPCS[k].date && S.rel[k].met).sort((a, b) => S.rel[b].v - S.rel[a].v); const k = ks[0];
    if (k) { const r = S.rel[k]; const act = r.stage === 'dating' && r.v >= 80 && S.money > 200000 ? 'propose' : !r.stage && r.v >= 60 ? 'confess' : 'meal'; return SIM.push({ kind: 'npc', npc: k, act }); }
  }
  if (n.hunger < 45) return S.money > 300 && Math.random() < 0.5 ? go('town', 'bento', 'bento') : go('home', 'kitchen', 'cook');
  if (n.hygiene < 40) return go('home', 'bath', 'shower');
  if (n.social < 35) return S.spouse ? go('home', 'tv', 'call') : Math.random() < 0.5 ? go('home', 'tv', 'call') : SIM.push({ kind: 'npc', npc: 'random', act: 'chat', loc: 'lake', obj: 'friend' });
  if (n.fun < 40 || S.stress > 55) { const r = Math.random(); return r < 0.35 ? go('home', 'tv', 'tv') : r < 0.6 ? go('lake', 'path', S.age < 70 ? 'jog' : 'sit') : r < 0.8 ? go('field', 'bike', 'ride') : go('home', 'desk', 'web'); }
  if (!S.retired && SIM.lv('law') < 8 && Math.random() < 0.4) return go('home', 'desk', 'study');
  if (SIM.lv('lang') < 6 && Math.random() < 0.3) return go('home', 'desk', 'lang');
  if (S.health < 60 && !S.flags.docToday) { S.flags.docToday = 1; return go('town', 'clinic', S.ill ? 'doctor' : 'checkup'); }
  return S.loc === 'home' ? go('home', 'tv', 'tv') : SIM.push({ kind: 'go', loc: 'home' });
};
/* 全自動時事件選第一個選項 */
SIM.autoEvent = function () { const id = S.eventQ.shift(); if (!id) return; const E = SIM.EVENTS[id]; if (E.x) E.x(); SIM.choose(id, 0); SIM.log(`［自動］${E.t}`, ''); };

/* ---------- 存檔 ---------- */
SIM.KEY = 'chishang_life_v1';
SIM.save = function () { try { const s = JSON.stringify(Object.assign({}, S, { _tuid: TUID })); const prev = localStorage.getItem(SIM.KEY); if (prev) localStorage.setItem(SIM.KEY + '_bak', prev); localStorage.setItem(SIM.KEY, s); return true; } catch (e) { return false; } };
SIM.load = function () {
  for (const k of [SIM.KEY, SIM.KEY + '_bak']) {
    try { const d = JSON.parse(localStorage.getItem(k)); if (d && d.name && d.needs) { for (const q of Object.keys(S)) delete S[q]; Object.assign(S, d); TUID = d._tuid || 1000; S.cur = null; S.queue = []; S.walkTo = null; return true; } } catch (e) { /* 下一份 */ }
  }
  return false;
};
SIM.peek = function () { try { return JSON.parse(localStorage.getItem(SIM.KEY)); } catch (e) { return null; } };
SIM.wipe = function () { try { localStorage.removeItem(SIM.KEY); } catch (e) { /* 略過 */ } };
})();

<script>
/* 模組 3／5：美術 — 側視場景（租屋處、公所、村辦公處、聚落、聚會所、文健站、稻田、街區、大坡池）、人物、晝夜與天氣、地圖（全部程式繪製） */
(function () {
'use strict';
const TAU = Math.PI * 2;
const R = window.R = {};
const OL = '#2b2622';
const E = (c, x, y, rx, ry, f, s, lw, rot) => { c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, TAU); if (f) { c.fillStyle = f; c.fill(); } if (s) { c.strokeStyle = s; c.lineWidth = lw || 1.5; c.stroke(); } };

  const overdue = S.tasks.filter(t => t.due <= S.day).length; $('taskDot').hidden = !S.tasks.length; $('taskDot').textContent = S.tasks.length; $('taskDot').style.background = overdue ? '#c8402a' : '#3d6e8c';
  renderQueue(); if (force) layoutHUD();

}

/* ---------- 面板 ---------- */
$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; UI.tab = UI.tab === b.dataset.t ? null : b.dataset.t; closeMenu(); renderSheet(); };

const PANELS = {

    if (!S.tasks.length) h += '<div class="card desc">目前沒有待辦案件。上午可以在公所向所長請教業務，下午到村辦公處坐班。</div>';

    for (const t of list) {
      const T = D.TASK[t.id], tg = taskTarget(t), d = t.due - S.day;
      h += `<div class="card tap" data-uid="${t.uid}"><div class="trow"><b>${esc(T.n)}</b><span class="tag ${d < 0 ? 'r' : d === 0 ? 'y' : ''}">${dueStr(t)}</span></div>
      <div style="margin-top:4px"><span class="tag g">📍 ${D.LOCS[tg.loc].n}・${esc((SIM.objOf(tg.loc, tg.obj) || {}).n || '')}</span><span class="tag">${T.t} 分</span>${t.left > 1 ? `<span class="tag y">還要 ${t.left} 次</span>` : ''}<span class="tag">${D.SKILLS[T.sk].ic} ${D.SKILLS[T.sk].n}</span></div>

  },
  ppl() {
    let h = '<h3>👥 人際關係</h3>';

    for (const k in D.NPCS) {
      const N = D.NPCS[k], r = S.rel[k]; if (!r.met || k === S.spouse) continue;

      h += `<div class="card"><div class="trow"><b>${esc(N.n)} ${st}</b><small style="color:var(--mute)">${esc(N.role)}</small></div>${meter((r.v + 100) / 2, r.v < 0 ? '#c8402a' : '#e76f8a')}<div class="acts">`;
      h += `<button class="btn s alt" data-npc="${k}" data-a="chat">📞 打電話聊天</button>`;
      if (N.date || k.startsWith('coworker')) h += `<button class="btn s alt" data-npc="${k}" data-a="meal">🍱 約吃飯 $400</button>`;
      if (N.date && !S.spouse) { if (!r.stage) h += `<button class="btn s" data-npc="${k}" data-a="confess" ${r.v < 40 ? 'disabled' : ''}>💗 告白</button>`; if (r.stage === 'dating') h += `<button class="btn s red" data-npc="${k}" data-a="propose" ${r.v < 70 || S.money < 150000 ? 'disabled' : ''}>💍 求婚（婚禮 15 萬）</button>`; }
      h += `<button class="btn s alt" data-npc="${k}" data-a="gift">🎁 送伴手禮 $500</button></div></div>`;
    }
    h += '<div class="desc">在公所、村辦公處、部落、文健站可以直接點人物互動。認識新朋友要靠緣分（隨機事件）。</div>';
    return h;
  },
  skill() {
    let h = '<h3>📚 技能 <small>在家讀書、上族語課、跑步，或做案件時都會成長</small></h3>';
    for (const k in D.SKILLS) { const lv = SIM.lv(k), xp = S.sk[k] || 0, a = lv * lv * 12, b = (lv + 1) * (lv + 1) * 12; h += `<div class="need" style="margin-bottom:8px"><div class="lb"><span>${D.SKILLS[k].ic} ${D.SKILLS[k].n}</span><b>Lv ${lv}</b></div>${meter(lv >= 10 ? 100 : (xp - a) / (b - a) * 100, '#3d6e8c')}</div>`; }
    h += '<div class="desc">法規熟悉與行政公文影響案件成功率與升官等考試；阿美族語讓部落與文健站的工作更順利；溝通協調讓陳情與臨櫃更好處理。</div>';
    return h;
  },
  job() {
    const R0 = D.RANKS[S.rank];
    const pay = S.retired ? '月退俸' : `${U.fmt(R0.pay + S.step * 1100 + Math.floor(S.years) * 120)} 元／月`;
    let h = `<h3>🏛️ ${esc(R0.n)}<small>${R0.grade}${S.retired ? '・已退休' : ''}</small></h3>`;
    h += `<div class="kv"><span>服務年資</span><b>${S.years} 年</b></div><div class="kv"><span>月薪</span><b>${pay}</b></div><div class="kv"><span>今年績效</span><b>${Math.round(S.perf)}</b></div><div class="kv"><span>家戶訪問</span><b>${S.visits}／${S.visitGoal}</b></div><div class="kv"><span>村民信任</span><b>${Math.round(S.trust)}</b></div><div class="kv"><span>今年遲到／早退／曠職</span><b>${S.late}／${S.early}／${S.absent}</b></div><div class="kv"><span>所長好感</span><b>${Math.round(S.rel.chief.v)}</b></div>`;
    h += `<div style="margin:10px 0 4px;font-weight:700">歷年考績</div><div class="grades">${S.grades.length ? S.grades.map(g => `<i class="${g === '乙' ? 'b' : g === '丙' ? 'c' : ''}">${g}</i>`).join('') : '<span class="desc">年底（1 月初）打考績</span>'}</div>`;
    h += `<div style="margin:10px 0 4px;font-weight:700">升遷之路</div>${D.RANKS.map((r, i) => `<div class="kv"><span>${i === S.rank ? '👉 ' : ''}${r.n}</span><b style="${i === S.rank ? 'color:var(--red)' : i < S.rank ? 'color:var(--mute)' : ''}">${r.grade}${r.exam ? '（需升官等考試）' : ''}</b></div>`).join('')}`;
    h += `<div class="desc" style="margin-top:8px">考績看年度績效（完成案件）、出勤、家戶訪問達標與所長評價。委任內連續甲等可晉升；委任五職等可報考升官等考試；所長出缺時優秀課員有機會接任。65 歲屆齡退休，60 歲且年資滿 25 年可自願退休。</div>`;
    h += `<div style="margin:10px 0 4px;font-weight:700">工作紀錄</div><div class="kv"><span>完成案件</span><b>${S.stats.cases}</b></div><div class="kv"><span>家戶訪視</span><b>${S.stats.visits}</b></div><div class="kv"><span>協助申請補助</span><b>${S.stats.helped}</b></div><div class="kv"><span>參與豐年祭</span><b>${S.stats.festivals}</b></div><div class="kv"><span>加班</span><b>${S.stats.overtime} 次</b></div>`;

  },
  life() {
    let h = `<h3>🏠 生活<small>存款 ${U.fmt(S.money)} 元</small></h3>`;
    h += `<div class="kv"><span>住處</span><b>${S.house === 'rent' ? '租屋（月租 6,500）' : S.house === 'loan' ? `自有房屋（房貸剩 ${S.loanLeft} 個月）` : '自有房屋'}</b></div>`;
    h += `<div class="kv"><span>家庭</span><b>${S.spouse ? `已婚・${S.kids.length} 個孩子` : '單身'}</b></div>`;
    h += '<div style="margin:10px 0 6px;font-weight:700">購物</div>';
    for (const it of D.SHOP) h += `<div class="card"><div class="trow"><b>${esc(it.n)}</b><button class="btn s ${S.upgrades[it.id] ? 'alt' : 'gold'}" data-buy="${it.id}" ${S.upgrades[it.id] ? 'disabled' : ''}>${S.upgrades[it.id] ? '已擁有' : '$' + U.fmt(it.price)}</button></div><div class="desc">${esc(it.d)}</div></div>`;
    h += `<div style="margin:10px 0 6px;font-weight:700">設定</div><div class="acts">
      <button class="btn s ${S.auto && !S.autoFull ? '' : 'alt'}" data-auto="1">🤖 自動生活（事件自己選）</button>
      <button class="btn s ${S.autoFull ? '' : 'alt'}" data-auto="2">⏩ 全自動快轉人生</button>
      <button class="btn s alt" data-auto="0">✋ 手動</button></div>
      <div class="acts" style="margin-top:8px"><button class="btn s" id="pSave">💾 存檔</button><button class="btn s alt" id="pTitle">回標題</button><button class="btn s red" id="pNew">重新開始人生</button></div>
      <div class="desc">每天自動存檔在這台裝置的瀏覽器裡（另有一份備份）。</div>`;

  },
  log() { return '<h3>📜 人生紀錄</h3>' + S.log.slice().reverse().map(l => { const c = SIM.cal(l.d); return `<div class="log ${l.kind || ''}"><small>${c.y}/${c.m}/${c.d} ${U.hm(l.t)}</small>${esc(l.m)}</div>`; }).join(''); },
};
$('sheet').onclick = e => {
  const b = e.target.closest('button,[data-uid]'); if (!b) return;
  if (b.dataset.do) { const t = S.tasks.find(q => q.uid === +b.dataset.do); if (t) { const g = taskTarget(t); SIM.push({ kind: 'task', uid: t.uid, loc: g.loc, obj: g.obj }); SFX.pop(); toast('已加入待辦'); renderQueue(); } return; }
  if (b.dataset.npc) { SIM.push({ kind: 'npc', npc: b.dataset.npc, act: b.dataset.a }); SFX.pop(); toast('已加入待辦'); renderQueue(); return; }
  if (b.dataset.buy) { const r = SIM.buy(b.dataset.buy); toast(r === 'ok' ? '買好了！' : r === 'money' ? '錢不夠' : '已經有了'); renderSheet(); return; }
  if (b.dataset.auto) { const v = +b.dataset.auto; S.auto = v > 0; S.autoFull = v === 2; if (v === 2) setSpeed(3); renderSheet(); refreshHUD(); return; }
  if (b.id === 'pSave') { toast(SIM.save() ? '已存檔' : '存檔失敗'); return; }
  if (b.id === 'pTitle') { SIM.save(); hideGame(); titleScreen(); return; }
  if (b.id === 'pNew') { if (!confirmNew()) return; SIM.wipe(); hideGame(); for (const k of Object.keys(S)) delete S[k]; createScreen(); $('title').hidden = false; return; }
};
function hideGame() { ['top', 'loc', 'rightBtns', 'bottom'].forEach(k => ($(k).hidden = true)); closeMenu(); $('feed').innerHTML = ''; }

/* ---------- 右側按鈕 ---------- */
$('bAuto').onclick = () => { if (!S.auto) { S.auto = true; S.autoFull = false; toast('🤖 自動生活：角色會自己安排（事件仍由你選）'); } else if (!S.autoFull) { S.autoFull = true; setSpeed(3); toast('⏩ 全自動：快轉人生，事件自動選擇'); } else { S.auto = false; S.autoFull = false; setSpeed(1); toast('✋ 改回手動'); } refreshHUD(); if (UI.tab === 'life') renderSheet(); };
$('bSave').onclick = () => toast(SIM.save() ? '💾 已存檔' : '存檔失敗');
$('bMap').onclick = openMap;
$('moodC').onclick = () => { UI.tab = 'need'; renderSheet(); };

/* ---------- 地圖 ---------- */
let mapHover = null;
function openMap() {
  if (S.cur && S.cur.kind === 'travel') { toast('騎車中……'); return; }
  closeMenu(); $('mapOv').hidden = false; drawMap();
  $('locList').innerHTML = Object.keys(D.LOCS).map(k => `<button data-l="${k}" class="${k === S.loc ? 'here' : ''}"><b>${D.LOCS[k].n}</b><small>${k === S.loc ? '📍 你在這裡' : `${D.LOCS[k].sub}・約 ${Math.round(D.travel(S.loc, k) * (S.upgrades.scooter ? 0.75 : 1))} 分`}</small></button>`).join('');
}
function drawMap() {
  const c = $('mapCv'), r = c.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
  c.width = Math.round(r.width * d); c.height = Math.round(r.height * d); const g = c.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0);
  R.map(g, r.width, r.height, S.loc, mapHover, D);
}
function goTo(k) { $('mapOv').hidden = true; if (k === S.loc) return; SIM.push({ kind: 'go', loc: k }); SFX.pop(); renderQueue(); }
$('locList').onclick = e => { const b = e.target.closest('button'); if (b) goTo(b.dataset.l); };
$('mapClose').onclick = () => ($('mapOv').hidden = true);
$('mapOv').onclick = e => { if (e.target === $('mapOv')) $('mapOv').hidden = true; };
const mapPick = e => { const r = $('mapCv').getBoundingClientRect(); const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height; let best = null, bd = 0.08; for (const k in D.LOCS) { const p = D.LOCS[k].map; const d = Math.hypot(p[0] - x, (p[1] - y) * 0.75); if (d < bd) { bd = d; best = k; } } return best; };
$('mapCv').addEventListener('pointermove', e => { const k = mapPick(e); if (k !== mapHover) { mapHover = k; drawMap(); } });
$('mapCv').addEventListener('pointerdown', e => { const k = mapPick(e); if (k) goTo(k); });

/* ---------- 事件 ---------- */
function showEvent() {
  const id = S.eventQ[0], E = SIM.EVENTS[id];
  if (!E) { S.eventQ.shift(); return; }
  closeMenu();
  const text = E.x();
  $('evBox').innerHTML = `<h2>${esc(E.t)}</h2><p>${esc(text)}</p><div class="opts">${E.o.map((o, i) => `<button class="btn ${i ? 'alt' : ''}" data-i="${i}">${esc(o[0])}</button>`).join('')}</div>`;
  $('evOv').hidden = false; SFX.pop();
  $('evBox').querySelector('.opts').onclick = ev => { const b = ev.target.closest('button'); if (!b) return; S.eventQ.shift(); SIM.choose(id, +b.dataset.i); $('evOv').hidden = true; handleEvents(); refreshHUD(true); };
}

/* ---------- 結局 ---------- */
function showEnd() {
  const d = S.dead, g = S.grades, cnt = k => g.filter(x => x === k).length;
  const epi = S.stats.helped > 800 ? '「謝謝你，這些年一直陪著我們。」——大埔村的族人' : S.stats.cases > 3000 ? '一位踏實的公務員，把每一件小事都做好。' : S.years >= 1 ? '在縱谷裡認真生活過的人。' : '人生很短，來不及好好看看池上的稻浪。';
  $('endBox').innerHTML = `<div style="text-align:center;font-size:40px">🌾</div><h2>${esc(S.name)}（${d.age} 歲）</h2><div class="epi">${esc(epi)}</div>
  <div class="kv"><span>辭世</span><b>${esc(d.date)}・${esc(d.cause)}</b></div>
  <div class="kv"><span>最高職務</span><b>${esc(D.RANKS[S.rank].n)}（${D.RANKS[S.rank].grade}）</b></div>
  <div class="kv"><span>服務年資</span><b>${S.years} 年${S.retired ? '・光榮退休' : ''}</b></div>
  <div class="kv"><span>考績</span><b>甲 ${cnt('甲')}・乙 ${cnt('乙')}・丙 ${cnt('丙')}</b></div>
  <div class="kv"><span>完成案件</span><b>${U.fmt(S.stats.cases)} 件</b></div>
  <div class="kv"><span>家戶訪視</span><b>${U.fmt(S.stats.visits)} 次</b></div>
  <div class="kv"><span>協助族人申請補助</span><b>${U.fmt(S.stats.helped)} 件</b></div>
  <div class="kv"><span>豐年祭</span><b>${S.stats.festivals} 次</b></div>
  <div class="kv"><span>家庭</span><b>${S.spouse ? `與${esc(D.NPCS[S.spouse].n)}結婚` : '單身'}${S.kids.length ? `・${S.kids.length} 個孩子` : ''}</b></div>
  <div class="kv"><span>留下的存款</span><b>${U.fmt(S.money)} 元</b></div>
  <div class="opts" style="margin-top:14px"><button class="btn" id="eNew">開始新的人生</button><button class="btn alt" id="eLog">回顧人生紀錄</button></div>`;
  $('endOv').hidden = false;
  $('eNew').onclick = () => { SIM.wipe(); hideGame(); $('endOv').hidden = true; for (const k of Object.keys(S)) delete S[k]; NEWL.name = ''; createScreen(); $('title').hidden = false; };
  $('eLog').onclick = () => { $('endOv').hidden = true; UI.tab = 'log'; renderSheet(); setTimeout(() => { const b = document.createElement('button'); b.className = 'btn'; b.textContent = '回到結局'; b.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:31'; b.onclick = () => { b.remove(); $('endOv').hidden = false; }; document.body.appendChild(b); }, 50); };
}

/* ---------- 存檔時機 ---------- */
document.addEventListener('visibilitychange', () => { if (document.hidden && S.name && !S.dead) SIM.save(); });
addEventListener('pagehide', () => { if (S.name && !S.dead) SIM.save(); });

titleScreen();
})();

</script>
